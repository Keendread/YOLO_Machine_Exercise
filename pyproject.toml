[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yolo-detection-starter"
version = "0.1.0"
description = "A commented learning base for object detection with Ultralytics YOLO."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.3.0",
    "windows-capture>=1.5.0",
    "pillow>=9.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
